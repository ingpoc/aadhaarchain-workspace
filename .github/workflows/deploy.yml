# Manual / operator-gated deploy. Never auto-deploys on push.
# HARD POLICY: $0 only — confirm Free (Render) / Hobby (Vercel) before running.
#
# Vercel project identity (fail-closed, 2026-08-19):
#   Buyer  VERCEL_PROJECT_ID_BUYER  → Hobby project `ondcbuyer`  (NO hyphen)
#          production alias           https://ondcbuyer.vercel.app
#          public FQDN                https://ondcbuyer.aadharcha.in
#   Seller VERCEL_PROJECT_ID_SELLER → Hobby project `ondcseller` (NO hyphen)
#          production alias           https://ondcseller.vercel.app
#          public FQDN                https://ondcseller.aadharcha.in
#   Team: Hobby "ingpoc's projects". Git is NOT connected (Connect Git would
#   hit GitHub OAuth / Security Checkpoint). Ship with this CLI workflow only.
#   Do NOT target hyphen twins `ondc-buyer` / `ondc-seller` — those historically
#   kept the custom domains while --prod landed on the no-hyphen vercel.app
#   aliases. After each Buyer/Seller --prod, index-*.js on the Hobby aliases
#   ondcbuyer.vercel.app / ondcseller.vercel.app AND the public FQDN must
#   match or this workflow fails. HTTP 200 is not enough. Unique DEPLOY_URL
#   (*-ingpocs-projects.vercel.app) is logged only; that host is not the SPA.
#
# Render gateway: identity-aadhar-gateway-main, autoDeploy off, Free. Stay Free.
#
# Unique grader jobs only (Buyer/Seller vitest stays in app CI):
#   AgentGuard contract parity, Gateway pytest+Postgres, offline graders, then deploy.
name: Portfolio Deploy

on:
  workflow_dispatch:
    inputs:
      surface:
        description: Surfaces to deploy
        required: true
        type: choice
        default: all
        options:
          - all
          - gateway
          - buyer
          - seller
      confirm_free_tier:
        description: Confirm Render=Free and Vercel=Hobby ($0 — abort if not)
        required: true
        type: boolean
        default: false
      skip_graders:
        description: Skip re-running graders (emergency only; prefer false)
        required: true
        type: boolean
        default: false

concurrency:
  group: portfolio-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AADHAAR_CHAIN_REPO: ${{ vars.AADHAAR_CHAIN_REPO || 'ingpoc/aadhaar-chain' }}
  ONDC_BUYER_REPO: ${{ vars.ONDC_BUYER_REPO || 'ingpoc/ondc-buyer' }}
  ONDC_SELLER_REPO: ${{ vars.ONDC_SELLER_REPO || 'ingpoc/ondc-seller' }}
  AADHAAR_CHAIN_REF: ${{ vars.AADHAAR_CHAIN_REF || 'main' }}
  ONDC_BUYER_REF: ${{ vars.ONDC_BUYER_REF || 'main' }}
  ONDC_SELLER_REF: ${{ vars.ONDC_SELLER_REF || 'main' }}
  GATEWAY_URL: https://identity-aadhar-gateway-main.onrender.com
  BUYER_URL: https://ondcbuyer.aadharcha.in
  SELLER_URL: https://ondcseller.aadharcha.in
  BUYER_VERCEL_APP: https://ondcbuyer.vercel.app
  SELLER_VERCEL_APP: https://ondcseller.vercel.app

jobs:
  gate:
    name: Free-tier + unique graders
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agentguard_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agentguard_test
      AADHAAR_CHAIN_ENV: demo
    steps:
      - name: Require free-tier confirmation
        if: ${{ inputs.confirm_free_tier != true }}
        run: |
          echo "::error::Abort: confirm_free_tier must be true. \$0 only — Render Free + Vercel Hobby."
          exit 1

      - uses: actions/checkout@v4
        if: ${{ inputs.skip_graders != true }}

      - name: Checkout aadharchain
        if: ${{ inputs.skip_graders != true }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.AADHAAR_CHAIN_REPO }}
          ref: ${{ env.AADHAAR_CHAIN_REF }}
          path: aadharchain

      - name: Checkout ondcbuyer
        if: ${{ inputs.skip_graders != true }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ONDC_BUYER_REPO }}
          ref: ${{ env.ONDC_BUYER_REF }}
          path: ondcbuyer

      - name: Checkout ondcseller
        if: ${{ inputs.skip_graders != true }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ONDC_SELLER_REPO }}
          ref: ${{ env.ONDC_SELLER_REF }}
          path: ondcseller

      - uses: actions/setup-python@v5
        if: ${{ inputs.skip_graders != true }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aadharchain/gateway/requirements.txt

      - name: Install gitleaks
        if: ${{ inputs.skip_graders != true }}
        run: |
          set -euo pipefail
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Secret scan (workspace + app trees)
        if: ${{ inputs.skip_graders != true }}
        run: |
          set -euo pipefail
          gitleaks detect --source . --no-git --config .gitleaks.toml --verbose --redact --exit-code 1
          gitleaks detect --source aadharchain --no-git --config .gitleaks.toml --verbose --redact --exit-code 1
          gitleaks detect --source ondcbuyer --no-git --config .gitleaks.toml --verbose --redact --exit-code 1
          gitleaks detect --source ondcseller --no-git --config .gitleaks.toml --verbose --redact --exit-code 1

      - name: AgentGuard contract parity
        if: ${{ inputs.skip_graders != true }}
        run: python3 scripts/verify_agentguard_contract_sync.py

      - name: Install gateway deps + PostgreSQL migrations
        if: ${{ inputs.skip_graders != true }}
        working-directory: aadharchain/gateway
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python - <<'PY'
          import asyncio
          from pathlib import Path

          from app.persistence import ConnectionPool, MigrationRunner

          async def migrate() -> None:
              pool = ConnectionPool(min_size=1, max_size=2)
              await pool.open()
              try:
                  applied = await MigrationRunner(pool, Path("migrations")).apply()
                  print(f"Applied migrations: {applied}")
              finally:
                  await pool.close()

          asyncio.run(migrate())
          PY

      - name: Gateway pytest
        if: ${{ inputs.skip_graders != true }}
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: ./scripts/verify-portfolio.sh --ci --skip-contract

      - name: ONDC offline graders
        if: ${{ inputs.skip_graders != true }}
        run: |
          python3 scripts/ondc_ci_graders.py --self-test
          python3 scripts/ondc_ci_graders.py --offline

  deploy-gateway:
    name: Deploy Render gateway
    needs: gate
    if: ${{ inputs.surface == 'all' || inputs.surface == 'gateway' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.AADHAAR_CHAIN_REPO }}
          ref: ${{ env.AADHAAR_CHAIN_REF }}

      - name: Require Render secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_GATEWAY_SERVICE_ID: ${{ secrets.RENDER_GATEWAY_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_API_KEY:-}" || -z "${RENDER_GATEWAY_SERVICE_ID:-}" ]]; then
            echo "::error::Missing secrets RENDER_API_KEY and/or RENDER_GATEWAY_SERVICE_ID (names only — set in repo Settings → Secrets)."
            exit 1
          fi

      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_GATEWAY_SERVICE_ID: ${{ secrets.RENDER_GATEWAY_SERVICE_ID }}
        run: |
          set -euo pipefail
          GATEWAY_COMMIT="$(git rev-parse HEAD)"
          curl -fsS -X POST \
            "https://api.render.com/v1/services/${RENDER_GATEWAY_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg commitId "$GATEWAY_COMMIT" \
              '{clearCache:"do_not_clear",commitId:$commitId}')" \
            | tee /tmp/render-deploy.json
          echo "Render deploy requested for exact commit ${GATEWAY_COMMIT} (Free plan only — do not upgrade; autoDeploy stays off)."

  deploy-buyer:
    name: Deploy Vercel Buyer
    needs: gate
    if: ${{ inputs.surface == 'all' || inputs.surface == 'buyer' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BUYER }}
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" || -z "${VERCEL_ORG_ID:-}" || -z "${VERCEL_PROJECT_ID:-}" ]]; then
            echo "::error::Missing VERCEL_TOKEN, VERCEL_ORG_ID, and/or VERCEL_PROJECT_ID_BUYER."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ONDC_BUYER_REPO }}
          ref: ${{ env.ONDC_BUYER_REF }}
          path: ondcbuyer

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Vercel CLI
        run: npm install -g vercel@55

      - name: Deploy Buyer (Hobby CLI — no Git integration)
        working-directory: ondcbuyer
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BUYER }}
        run: |
          set -euo pipefail
          # Fail-closed identity: VERCEL_PROJECT_ID_BUYER must be Hobby project
          # `ondcbuyer` (no hyphen), not `ondc-buyer`. Git stays disconnected.
          # Do not flip VITE_COMMERCE_DEMO_MODE here — use project env on Vercel.
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          python3 "$GITHUB_WORKSPACE/scripts/ondc_ci_graders.py" \
            --vercel-project-identity buyer \
            --project-json .vercel/project.json
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" --format=json \
            | tee /tmp/buyer-deploy.json
          DEPLOY_URL="$(python3 "$GITHUB_WORKSPACE/scripts/ondc_ci_graders.py" --print-deploy-url /tmp/buyer-deploy.json)"
          echo "Buyer production deployment: ${DEPLOY_URL}"
          # Unique DEPLOY_URL is not the SPA. Fail-closed parity is Hobby alias vs FQDN.
          python3 "$GITHUB_WORKSPACE/scripts/ondc_ci_graders.py" --bundle-parity \
            --buyer-production "${BUYER_VERCEL_APP}" \
            --buyer "${BUYER_URL}"

  deploy-seller:
    name: Deploy Vercel Seller
    needs: gate
    if: ${{ inputs.surface == 'all' || inputs.surface == 'seller' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SELLER }}
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" || -z "${VERCEL_ORG_ID:-}" || -z "${VERCEL_PROJECT_ID:-}" ]]; then
            echo "::error::Missing VERCEL_TOKEN, VERCEL_ORG_ID, and/or VERCEL_PROJECT_ID_SELLER."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ONDC_SELLER_REPO }}
          ref: ${{ env.ONDC_SELLER_REF }}
          path: ondcseller

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Vercel CLI
        run: npm install -g vercel@55

      - name: Deploy Seller (Hobby CLI — no Git integration)
        working-directory: ondcseller
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SELLER }}
        run: |
          set -euo pipefail
          # Fail-closed identity: VERCEL_PROJECT_ID_SELLER must be Hobby project
          # `ondcseller` (no hyphen), not `ondc-seller`. Git stays disconnected.
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          python3 "$GITHUB_WORKSPACE/scripts/ondc_ci_graders.py" \
            --vercel-project-identity seller \
            --project-json .vercel/project.json
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" --format=json \
            | tee /tmp/seller-deploy.json
          DEPLOY_URL="$(python3 "$GITHUB_WORKSPACE/scripts/ondc_ci_graders.py" --print-deploy-url /tmp/seller-deploy.json)"
          echo "Seller production deployment: ${DEPLOY_URL}"
          # Unique DEPLOY_URL is not the SPA. Fail-closed parity is Hobby alias vs FQDN.
          python3 "$GITHUB_WORKSPACE/scripts/ondc_ci_graders.py" --bundle-parity \
            --seller-production "${SELLER_VERCEL_APP}" \
            --seller "${SELLER_URL}"

  post-probe:
    name: Post-deploy probes
    needs: [gate, deploy-gateway, deploy-buyer, deploy-seller]
    if: >-
      always() &&
      needs.gate.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wake + probe public FQDNs
        run: |
          set -euo pipefail
          wake() {
            local url="$1"
            local code
            for i in 1 2 3 4 5 6; do
              code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "$url" || echo 000)
              echo "$url → $code (attempt $i)"
              if [[ "$code" =~ ^2 ]]; then
                return 0
              fi
              sleep 15
            done
            echo "::error::Probe failed after wake retries: $url (last=$code)"
            return 1
          }

          # Prefer custom domain; fall back to Render URL for Free cold start.
          GW="${{ env.GATEWAY_URL }}"
          if ! curl -fsS --max-time 20 "https://gateway.aadharcha.in/api/health" >/dev/null; then
            wake "${GW}/api/health"
          else
            GW="https://gateway.aadharcha.in"
            wake "${GW}/api/health"
          fi
          curl -fsS "${GW}/api/auth/providers" | head -c 500
          echo
          wake "${GW}/ondc/np/buyer/status" || true
          wake "${GW}/ondc/np/seller/status" || true

          if [[ "${{ inputs.surface }}" == "all" || "${{ inputs.surface }}" == "buyer" ]]; then
            wake "${BUYER_URL}/ondc-site-verification.html"
          fi
          if [[ "${{ inputs.surface }}" == "all" || "${{ inputs.surface }}" == "seller" ]]; then
            wake "${SELLER_URL}/ondc-site-verification.html"
          fi

          python3 scripts/ondc_ci_graders.py --live --soft \
            --gateway https://gateway.aadharcha.in \
            --buyer "${BUYER_URL}" \
            --seller "${SELLER_URL}"

          if [[ "${{ inputs.surface }}" == "all" ]]; then
            python3 scripts/ondc_ci_graders.py --bundle-parity
          elif [[ "${{ inputs.surface }}" == "buyer" ]]; then
            python3 scripts/ondc_ci_graders.py --bundle-parity \
              --buyer-production "${BUYER_VERCEL_APP}" --buyer "${BUYER_URL}"
          elif [[ "${{ inputs.surface }}" == "seller" ]]; then
            python3 scripts/ondc_ci_graders.py --bundle-parity \
              --seller-production "${SELLER_VERCEL_APP}" --seller "${SELLER_URL}"
          fi

          echo "Post-probes complete. Stay on Free/Hobby — do not upgrade on failure."
